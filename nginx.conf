worker_processes auto; # Tự động chọn số tiến trình theo CPU

events {
    worker_connections 1024; # Số kết nối đồng thời mỗi worker
}

http {
    include       mime.types; # Map extension -> MIME types
    default_type  application/octet-stream; # MIME mặc định
    sendfile        on; # Tối ưu gửi file tĩnh
    keepalive_timeout  65; # Thời gian giữ kết nối keep-alive

    server {
        listen 80; # Lắng nghe cổng HTTP 80
        server_name _; # Mặc định nhận mọi host

        # Thêm headers bảo mật cơ bản
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        client_max_body_size 25m; # Giới hạn kích thước request (upload)

        # Phục vụ static trực tiếp từ volume /static
        location /static/ {
            alias /static/; # alias thay vì root để path chính xác
            access_log off; # Tắt log truy cập static
            expires 7d; # Cache trình duyệt 7 ngày
        }

        # Phục vụ media trực tiếp từ volume /media
        location /media/ {
            alias /media/; # alias cho thư mục media
            access_log off;
            expires 7d;
        }

        # Reverse proxy tất cả request còn lại vào service web:8000
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host; # Truyền host gốc
            proxy_set_header X-Real-IP $remote_addr; # IP client thật
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Chuỗi IP qua proxy
            proxy_set_header X-Forwarded-Proto $scheme; # http/https
        }
    }
}
