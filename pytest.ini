[tool:pytest]
DJANGO_SETTINGS_MODULE = BE_BLOG.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
    --nomigrations
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
    celery: Celery task tests
